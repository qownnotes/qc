name: Release
on:
  push:
    branches:
      - release
permissions:
  contents: write
concurrency:
  group: release
  cancel-in-progress: false
env:
  GO_VERSION: "1.25"
jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Detect release version
        id: version
        run: |
          python3 - <<'PY'
          import os
          import pathlib
          import re

          versions = re.findall(r'^\s*version\s*=\s*"(\d+\.\d+\.\d+)";', pathlib.Path("default.nix").read_text(), re.MULTILINE)
          if len(versions) != 1:
              raise SystemExit("Expected exactly one stable release version in default.nix")
          version = versions[0]
          changelog = re.search(r'^## v(\d+\.\d+\.\d+)\s*$', pathlib.Path("CHANGELOG.md").read_text(), re.MULTILINE)
          if changelog is None or changelog[1] != version:
              raise SystemExit("The latest CHANGELOG.md version must match default.nix")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"tag=v{version}\n")
          print(f"Release version: v{version}")
          PY
      - name: Install dependencies
        run: |
          sudo apt-get -y update
          sudo apt-get -y install rpm
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Test
        run: go test ./...
      - name: Prepare release tag
        id: tag
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            if [[ "$(git rev-parse "$RELEASE_TAG^{commit}")" != "$GITHUB_SHA" ]]; then
              echo "::error::Tag $RELEASE_TAG already points to another commit. Bump the version before releasing."
              exit 1
            fi
            if [[ "$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' 2>/dev/null || true)" == "false" ]]; then
              echo "Release $RELEASE_TAG is already published; skipping."
              echo "publish=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          else
            git tag "$RELEASE_TAG" "$GITHUB_SHA"
            git push origin "refs/tags/$RELEASE_TAG"
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"
      - name: Release
        if: steps.tag.outputs.publish == 'true'
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ steps.version.outputs.tag }}
